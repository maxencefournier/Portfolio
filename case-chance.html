<script>
function setupArrowCarousel(trackId, prevId, nextId, itemsPerView) {
  const track = document.getElementById(trackId);
  const prevBtn = document.getElementById(prevId);
  const nextBtn = document.getElementById(nextId);
  if (!track || !prevBtn || !nextBtn) return;

  const items = track.children;
  let index = 0;

  function update() {
    const itemWidth = items[0].getBoundingClientRect().width;
    const gap = parseFloat(getComputedStyle(track).gap) || 0;
    const step = itemWidth + gap;
    track.style.transform = "translateX(-" + (index * step) + "px)";
  }

  prevBtn.addEventListener("click", () => {
    index = Math.max(index - itemsPerView, 0);
    update();
  });

  nextBtn.addEventListener("click", () => {
    const maxIndex = Math.max(items.length - itemsPerView, 0);
    index = Math.min(index + itemsPerView, maxIndex);
    update();
  });

  window.addEventListener("resize", update);
  update();
}

setupArrowCarousel("projTrack", "projPrev", "projNext", 3);
</script>
